[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-chatbot-services"
version = "0.1.0"
description = "Independently deployable banking chatbot API services"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "redis>=5.0",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "PyJWT[crypto]>=2.10",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
orchestrator = [
    "langchain-google-genai>=2.0",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.2,<4",
    "nemoguardrails>=0.14,<1",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7,<4",
]
dev = ["httpx>=0.27", "pytest>=8.3"]

[tool.setuptools.packages.find]
include = ["services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"